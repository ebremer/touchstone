# Configuration baseline from DESIGN.md paragraph 6.
spring:
  application:
    name: touchstone-mcp
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: touchstone-harness
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        instructions: "LWS conformance harness. Start with list_requirements or coverage."
        annotation-scanner:
          enabled: true

# Harness locations (DESIGN.md paragraph 7.1: targets are pre-registered here, never passed to tools).
touchstone:
  catalog: catalog
  manifests: manifests
  targets: targets.yaml
  runs: runs

server:
  port: 9090
  # Loopback by default, deliberately. This process drives pre-registered targets with
  # deliberately malformed and high-volume traffic and exposes an unauthenticated tool surface
  # that starts runs; Spring Boot's default is every interface, so the shipped configuration
  # would have put that on the network of whatever machine ran it. DESIGN.md 7.5 asks for a
  # Spring Security OAuth2 resource server IF the endpoint is hosted — until that exists,
  # binding to loopback is the honest posture, and an operator who means to expose it sets
  # server.address explicitly and fronts it with something that authenticates. D-0046.
  address: 127.0.0.1
  shutdown: graceful
  jetty:
    threads:
      max: 64
    # Streamable connections are long-lived; Jetty's default idle timeout kills them.
    connection-idle-timeout: 300s
