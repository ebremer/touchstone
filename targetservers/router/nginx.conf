# The targetservers router: one rule for every target server (README.md, "The contract").
#
#   /targets/<name>/...                              -> http://<name>:8080/...
#   /.well-known/lws-configuration/targets/<name>    -> http://<name>:8080/.well-known/lws-configuration
#
# <name> is the target's service name on the compose network, which Docker's DNS resolves, so a new
# target needs no line here: start a container of that name that keeps the contract. The prefix
# /targets/<name> is stripped unless the target is listed in $keep_prefix below, and is always sent
# as X-Forwarded-Prefix. Paths are taken from the raw request line, so percent-encoding reaches the
# target as the client sent it.
worker_processes auto;
# Docker's soft limit is 1024 open files; a worker may raise it to the hard limit.
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    server_tokens off;

    # Docker's embedded DNS, re-asked often: a target that is recreated comes back on a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The target a request is for, from the raw request line.
    map $request_uri $target {
        "~^/targets/([a-z0-9][a-z0-9-]*)(?:[/?]|$)"                                  $1;
        "~^/\.well-known/lws-configuration/targets/([a-z0-9][a-z0-9-]*)/?(?:\?.*)?$" $1;
        default                                                                      "";
    }
    # The raw path after /targets/<name>, query included.
    map $request_uri $target_rest {
        "~^/targets/[a-z0-9][a-z0-9-]*(/.*)$" $1;
        default                               "";
    }
    # Targets that serve their public paths whole, prefix included (their base URL carries it and they
    # match request paths against it), rather than from their own root.
    map $target $keep_prefix {
        default 0;
        css     1;
    }
    # The scheme and host the public URL has: the outer proxy's, or this router's when reached directly.
    map $http_x_forwarded_proto $public_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $public_host {
        ""      $http_host;
        default $http_x_forwarded_host;
    }
    # The client's address: the outer proxy's X-Forwarded-For passed on as it is, so a target that
    # trusts one hop sees the client and not this router.
    map $http_x_forwarded_for $client_for {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 8080 default_server;

        # Bodies and slow responses go straight through: the targets set their own limits.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Forwarded-Proto  $public_proto;
        proxy_set_header X-Forwarded-Host   $public_host;
        proxy_set_header X-Forwarded-For    $client_for;
        proxy_set_header X-Forwarded-Prefix /targets/$target;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # A name no running container has: nginx cannot resolve it, and says so. A target's own 502 is not
        # intercepted (proxy_intercept_errors is off), so it reaches the client as the target sent it.
        error_page 502 = @no_target;
        location @no_target {
            default_type text/plain;
            return 502 "no target \"$target\" is running here\n";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /targets/ {
            if ($target = "") {
                return 404;
            }
            if ($target_rest = "") {
                return 301 /targets/$target/;
            }
            set $upstream_uri $target_rest;
            if ($keep_prefix) {
                set $upstream_uri $request_uri;
            }
            proxy_pass http://$target:8080$upstream_uri;
        }

        # RFC 8414: the metadata of the authorization server whose issuer is <public origin>/targets/<name>.
        # A target answers it at /.well-known/lws-configuration of its own root (under the prefix if kept).
        location /.well-known/lws-configuration/targets/ {
            if ($target = "") {
                return 404;
            }
            set $upstream_uri /.well-known/lws-configuration;
            if ($keep_prefix) {
                set $upstream_uri /targets/$target/.well-known/lws-configuration;
            }
            proxy_pass http://$target:8080$upstream_uri;
        }

        location / {
            return 404;
        }
    }
}
