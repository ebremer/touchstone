# The targetservers router: one rule for every target server (README.md, "The contract").
#
#   /<set>/<name>/...                                -> http://<name>:8080/...
#   /.well-known/lws-configuration/<set>/<name>      -> http://<name>:8080/.well-known/lws-configuration
#   /.well-known/oauth-protected-resource/<set>/<name>/... -> http://<name>:8080/.well-known/oauth-protected-resource/...
#
# <set> is the path segment the set of targets is published under: /targets/ by default, another for a
# second set beside it (LWS_TARGETS_PATH in compose.yaml, which tells the targets their public URLs). The
# router takes it from the request, so one configuration serves either. <name> is the target's service
# name on the compose network, which Docker's DNS resolves, so a new target needs no line here: start a
# container of that name that keeps the contract. How the path reaches it is the target's mode
# ($prefix_mode below): stripped of /<set>/<name> by default, kept for a target that needs it, or passed
# whole. The prefix is always sent as X-Forwarded-Prefix. Paths are taken from the raw request line, so
# percent-encoding reaches the target as the client sent it.
worker_processes auto;
# Docker's soft limit is 1024 open files; a worker may raise it to the hard limit.
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    server_tokens off;

    # Docker's embedded DNS, re-asked often: a target that is recreated comes back on a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The target a request is for, and the set it is published in, from the raw request line.
    map $request_uri $target {
        "~^/[a-z0-9][a-z0-9-]*/([a-z0-9][a-z0-9-]*)(?:[/?]|$)"                                  $1;
        "~^/\.well-known/lws-configuration/[a-z0-9][a-z0-9-]*/([a-z0-9][a-z0-9-]*)/?(?:\?.*)?$" $1;
        "~^/\.well-known/oauth-protected-resource/[a-z0-9][a-z0-9-]*/([a-z0-9][a-z0-9-]*)(?:[/?]|$)" $1;
        default                                                                                 "";
    }
    map $request_uri $target_set {
        "~^/([a-z0-9][a-z0-9-]*)/[a-z0-9][a-z0-9-]*(?:[/?]|$)"                                  $1;
        "~^/\.well-known/lws-configuration/([a-z0-9][a-z0-9-]*)/[a-z0-9][a-z0-9-]*/?(?:\?.*)?$" $1;
        "~^/\.well-known/oauth-protected-resource/([a-z0-9][a-z0-9-]*)/[a-z0-9][a-z0-9-]*(?:[/?]|$)" $1;
        default                                                                                 "";
    }
    # The raw path after /<set>/<name>, query included.
    map $request_uri $target_rest {
        "~^/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*(/.*)$" $1;
        default                                          "";
    }
    # The same, after /.well-known/oauth-protected-resource/<set>/<name>: the path of the resource whose RFC 9728
    # protected resource metadata is asked for, relative to the target.
    map $request_uri $resource_rest {
        "~^/\.well-known/oauth-protected-resource/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*([/?].*)?$" $1;
        default                                                                                  "";
    }
    # How a target takes its paths (README.md, "The contract"):
    #   strip  (default) from its own root: /<set>/<name>/x -> /x, and its RFC 8414 metadata URL
    #          -> /.well-known/lws-configuration;
    #   keep   with the prefix, as its base URL carries it and it matches request paths against it:
    #          /<set>/<name>/x as it is, the metadata URL -> /<set>/<name>/.well-known/lws-configuration;
    #   whole  every path as requested, the metadata URL included: the target mounts itself at
    #          /<set>/<name> and answers /.well-known/lws-configuration/<set>/<name> itself.
    map $target $prefix_mode {
        default strip;
        css     keep;
        lwsd    whole;
    }
    map $prefix_mode $targets_uri {
        strip   $target_rest;
        default $request_uri;
    }
    map $prefix_mode $metadata_uri {
        strip   /.well-known/lws-configuration;
        keep    /$target_set/$target/.well-known/lws-configuration;
        default $request_uri;
    }
    # RFC 9728 section 3.1 puts a resource's metadata at the well-known prefix followed by the resource's path: from
    # its own root for a target that strips the prefix, as requested for one that keeps it or mounts itself there.
    # A target may take its metadata URLs otherwise than its paths: sparq-lws strips the prefix from its paths but
    # answers its metadata at the whole public path it advertises, /.well-known/oauth-protected-resource/<set>/<name>.
    map $target $resource_metadata_mode {
        default   $prefix_mode;
        sparq-lws whole;
    }
    map $resource_metadata_mode $resource_metadata_uri {
        strip   /.well-known/oauth-protected-resource$resource_rest;
        default $request_uri;
    }
    # The scheme and host the public URL has: the outer proxy's, or this router's when reached directly.
    map $http_x_forwarded_proto $public_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $public_host {
        ""      $http_host;
        default $http_x_forwarded_host;
    }
    # The client's address: the outer proxy's X-Forwarded-For passed on as it is, so a target that
    # trusts one hop sees the client and not this router.
    map $http_x_forwarded_for $client_for {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }
    # A WebSocket upgrade goes through, and no other: an HTTP/2 cleartext upgrade (Upgrade: h2c, which Java's
    # HttpClient asks for on every plain-HTTP request) is this router's to decline, and it answers in HTTP/1.1.
    # Passed on, it would have the target switch protocols halfway through a request with a body.
    map $http_upgrade $upstream_upgrade {
        "~*^websocket$" $http_upgrade;
        default         "";
    }
    map $upstream_upgrade $connection_upgrade {
        ""      "";
        default upgrade;
    }

    server {
        listen 8080 default_server;

        # Bodies and slow responses go straight through: the targets set their own limits.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Forwarded-Proto  $public_proto;
        proxy_set_header X-Forwarded-Host   $public_host;
        proxy_set_header X-Forwarded-For    $client_for;
        proxy_set_header X-Forwarded-Prefix /$target_set/$target;
        proxy_set_header Upgrade            $upstream_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # A name no running container has: nginx cannot resolve it, and says so. A target's own 502 is not
        # intercepted (proxy_intercept_errors is off), so it reaches the client as the target sent it.
        error_page 502 = @no_target;
        location @no_target {
            default_type text/plain;
            return 502 "no target \"$target\" is running here\n";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # RFC 8414: the metadata of the authorization server whose issuer is <public origin>/<set>/<name>,
        # sent where the target's mode says it answers it.
        location /.well-known/lws-configuration/ {
            if ($target = "") {
                return 404;
            }
            proxy_pass http://$target:8080$metadata_uri;
        }

        # RFC 9728: the protected resource metadata of a resource of <public origin>/<set>/<name>.
        location /.well-known/oauth-protected-resource/ {
            if ($target = "") {
                return 404;
            }
            proxy_pass http://$target:8080$resource_metadata_uri;
        }

        location / {
            if ($target = "") {
                return 404;
            }
            if ($target_rest = "") {
                return 301 /$target_set/$target/;
            }
            proxy_pass http://$target:8080$targets_uri;
        }
    }
}
