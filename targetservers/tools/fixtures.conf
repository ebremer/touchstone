# The fixture host's front for run-all.sh (compose.local.yaml, service "fixtures"): Touchstone's fixture host listens on
# plain HTTP in the harness container (network alias "harness", port 18080) only while a run goes; this gives it the
# name "fixtures" for the whole session, plain on 18080 and with TLS on 443 (a certificate for "fixtures" from the
# run's own CA, which the servers that fetch over HTTPS are told to trust). Between runs it answers 502.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 18080;
        listen 443 ssl;
        ssl_certificate     /etc/fixtures-tls/fixtures.pem;
        ssl_certificate_key /etc/fixtures-tls/fixtures.key;

        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        location / {
            set $harness harness:18080;
            proxy_pass http://$harness$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }
    }
}
