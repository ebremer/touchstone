; PHP-FPM pool settings for the lws-drupal target (php-fpm.d/zz-lws.conf). Conformance runs send 16 requests at
; once, and lws_notify delivers webhooks after the response, so a request keeps its worker a little longer.
[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
