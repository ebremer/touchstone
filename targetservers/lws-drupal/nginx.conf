# nginx in front of PHP-FPM (127.0.0.1:9000) for the lws-drupal target. The router has stripped /targets/lws-drupal,
# so the site is at the root here. LWS paths and the well-known paths always go to Drupal, whatever their names;
# everything else is a static file if one exists, and Drupal if not.
user www-data;
worker_processes 4;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # lws_storage.settings:max_upload_bytes refuses larger content itself (64 MiB); this is a backstop.
    client_max_body_size 80m;

    server {
        listen 8080 default_server;
        root /opt/drupal/web;

        location ^~ /lws/ {
            try_files /nonexistent @drupal;
        }
        location ^~ /.well-known/ {
            try_files /nonexistent @drupal;
        }

        # As Drupal's .htaccess: no source, configuration or dot files.
        location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|/\.|/(composer\.(json|lock)|web\.config)$ {
            return 404;
        }
        location ~ ^/sites/[^/]+/files/.*\.php$ {
            return 404;
        }
        # Only index.php runs; any other *.php URL is a Drupal path.
        location ~ \.php$ {
            try_files /nonexistent @drupal;
        }
        location / {
            try_files $uri @drupal;
        }
        location @drupal {
            rewrite ^ /index.php last;
        }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
        }
    }
}
