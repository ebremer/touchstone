schemaVersion: 1
id: core/link-up-on-resources
title: Non-root resources carry Link rel=up to their parent container
requirements:
  - https://example.org/touchstone/req/lws10-core/link-up-on-non-root-resources
  - https://example.org/touchstone/req/lws10-core/containment-rel-up-get-head
steps:
  - name: creation response links upward
    request:
      method: POST
      target: "${test.container}"
      headers:
        Content-Type: text/plain
        Slug: note
      body: "where is my parent"
    expect:
      status: 201
      headers:
        Link: { contains: 'rel="up"' }
    bind:
      created: "header:Location"

  - name: GET links upward
    request:
      method: GET
      target: "${created}"
    expect:
      status: 200
      headers:
        Link: { contains: 'rel="up"' }

  - name: HEAD links upward
    request:
      method: HEAD
      target: "${created}"
    expect:
      status: 200
      headers:
        Link: { contains: 'rel="up"' }
