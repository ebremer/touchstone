schemaVersion: 1
id: core/create-in-missing-container-404
title: POST into a nonexistent container yields 404
requirements:
  - https://example.org/touchstone/req/lws10-core/create-post-missing-container-404
steps:
  - name: POST into a container that does not exist
    request:
      method: POST
      target: "${test.container}does-not-exist/"
      headers:
        Content-Type: text/plain
      body: "lost letter"
    expect:
      status: 404
