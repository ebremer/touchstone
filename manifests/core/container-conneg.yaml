schemaVersion: 1
id: core/container-conneg
title: Container representations negotiate lws+json, ld+json and json with an identical payload
description: >-
  Content negotiation moved in the 21 August 2026 draft: the four clauses that spelled out one
  media type each collapsed into a single Media Type Equivalence clause in 12.1.1, which says the
  three types are equivalent, the body is the same document, and only the Content-Type varies.
  The `Vary: Accept` header is new alongside it — a cache that does not know the response depends
  on Accept will hand a JSON-LD client the plain-JSON representation of the same container.
requirements:
  - https://example.org/touchstone/req/lws10-core/conneg-media-type-equivalence
  - https://example.org/touchstone/req/lws10-core/conneg-vary-accept
  - https://example.org/touchstone/req/lws10-core/lws-json-media-type-container-representation
steps:
  - name: lws+json is served and all three representations are graph-equivalent
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/lws+json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/lws+json }
        # SHOULD, not MUST — but the whole point of negotiating is lost downstream without it.
        Vary: { contains: Accept }
      connegEquivalent:
        accepts:
          - application/lws+json
          - application/ld+json
          - application/json

  - name: ld+json echoes its content type
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/ld+json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/ld+json }

  - name: plain json echoes its content type
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/json }
