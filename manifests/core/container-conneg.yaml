schemaVersion: 1
id: core/container-conneg
title: Container representations negotiate lws+json, ld+json and json with an identical payload
requirements:
  - https://example.org/touchstone/req/lws10-core/container-representation-conneg
  - https://example.org/touchstone/req/lws10-core/conneg-identical-payload
  - https://example.org/touchstone/req/lws10-core/conneg-lws-json-content-type
  - https://example.org/touchstone/req/lws10-core/conneg-ld-json-content-type
  - https://example.org/touchstone/req/lws10-core/conneg-json-content-type
steps:
  - name: lws+json is served and all three representations are graph-equivalent
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/lws+json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/lws+json }
      connegEquivalent:
        accepts:
          - application/lws+json
          - application/ld+json
          - application/json

  - name: ld+json echoes its content type
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/ld+json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/ld+json }

  - name: plain json echoes its content type
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/json
    expect:
      status: 200
      headers:
        Content-Type: { contains: application/json }
