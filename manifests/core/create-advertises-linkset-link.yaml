schemaVersion: 1
id: core/create-advertises-linkset-link
title: A 201 advertises the created resource's linkset, not only its parent
description: >-
  The creation clause names two link relations, rel="up" and rel="linkset", and only the first
  was being checked. The linkset is where a resource's metadata is edited, and LWS gives a
  client no other way to find it — there is no path convention it is entitled to assume — so a
  201 that omits the relation leaves the metadata unreachable however correctly it is served.
requirements:
  - https://example.org/touchstone/req/lws10-core/create-post-201-location-links
steps:
  - name: create a data resource
    request:
      method: POST
      target: "${test.container}"
      headers:
        Content-Type: text/plain
        Slug: described
      body: "a resource with metadata"
    expect:
      status: 201
      headers:
        Location: { present: true }
        # Both relations the clause requires, on the 201 itself.
        Link:
          matches: 'rel="?linkset"?'
    bind:
      created: "header:Location"

  - name: and the resource itself keeps advertising both
    request:
      method: GET
      target: "${created}"
    expect:
      status: 200
      headers:
        Link:
          matches: 'rel="?linkset"?'

  - name: creating a container advertises its linkset too
    request:
      method: POST
      target: "${test.container}"
      headers:
        Slug: sub
        Link: '<https://www.w3.org/ns/lws#Container>; rel="type"'
    expect:
      status: 201
      headers:
        Link:
          matches: 'rel="?linkset"?'
