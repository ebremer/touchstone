schemaVersion: 1
id: core/put-unconditional-428
title: An unconditional PUT on an ETagged resource is rejected with 428
requirements:
  - https://example.org/touchstone/req/lws10-core/put-unconditional-rejected-428
steps:
  - name: create a data resource (server issues ETags)
    request:
      method: POST
      target: "${test.container}"
      headers:
        Content-Type: text/plain
      body: "original content"
    expect:
      status: 201
      headers:
        ETag: { present: true }
    bind:
      created: "header:Location"

  - name: a PUT without If-Match is rejected
    request:
      method: PUT
      target: "${created}"
      headers:
        Content-Type: text/plain
      body: "overwrite attempt"
    expect:
      status: 428

  - name: the original content survives
    request:
      method: GET
      target: "${created}"
    expect:
      status: 200
      body:
        matches: "original content"
