schemaVersion: 1
id: core/delete-non-empty-container-409
title: Non-recursive DELETE of a non-empty container is rejected; Depth infinity recurses
requirements:
  - https://example.org/touchstone/req/lws10-core/delete-non-empty-container-409-depth
steps:
  - name: create a sub-container
    request:
      method: POST
      target: "${test.container}"
      headers:
        Slug: sub
        Link: '<https://www.w3.org/ns/lws#Container>; rel="type"'
    expect:
      status: 201
    bind:
      sub: "header:Location"

  - name: put something inside it
    request:
      method: POST
      target: "${sub}"
      headers:
        Content-Type: text/plain
        Slug: child
      body: "occupant"
    expect:
      status: 201

  - name: plain DELETE of the non-empty container is rejected
    request:
      method: DELETE
      target: "${sub}"
    expect:
      status: 409

  - name: recursive DELETE with Depth infinity succeeds
    request:
      method: DELETE
      target: "${sub}"
      headers:
        Depth: infinity
    expect:
      status: 204

  - name: the container is gone
    request:
      method: GET
      target: "${sub}"
    expect:
      status: 404
