schemaVersion: 1
id: core/contained-resource-type-values
title: A contained resource description types each member DataResource or Container
description: >-
  A container listing is how a client decides what it may do with a member without fetching
  it, and that decision rests on `type`. Each container here holds exactly one member, so the
  assertion names a determinate item rather than depending on listing order.
requirements:
  - https://example.org/touchstone/req/lws10-core/contained-resource-type-values
steps:
  - name: create a sub-container
    request:
      method: POST
      target: "${test.container}"
      headers:
        Link: '<https://www.w3.org/ns/lws#Container>; rel="type"'
    expect:
      status: 201
    bind:
      sub: "header:Location"

  - name: the parent types its container member Container
    request:
      method: GET
      target: "${test.container}"
      headers:
        Accept: application/lws+json
    expect:
      status: 200
      json:
        - pointer: "/totalItems"
          equals: 1
        - pointer: "/items/0/id"
          equals: "${sub}"
        # "or an array containing at least one of these two strings" — a server that types
        # its members with an array is conforming, so accept either shape.
        - pointer: "/items/0/type"
          matches: '(?s).*Container.*'

  - name: put a data resource inside it
    request:
      method: POST
      target: "${sub}"
      headers:
        Content-Type: text/plain
      body: "contained"
    expect:
      status: 201
    bind:
      leaf: "header:Location"

  - name: the sub-container types its data member DataResource
    request:
      method: GET
      target: "${sub}"
      headers:
        Accept: application/lws+json
    expect:
      status: 200
      json:
        - pointer: "/totalItems"
          equals: 1
        - pointer: "/items/0/id"
          equals: "${leaf}"
        - pointer: "/items/0/type"
          matches: '(?s).*DataResource.*'
