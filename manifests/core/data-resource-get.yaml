schemaVersion: 1
id: core/data-resource-get
title: GET returns a data resource with its stored media type and an ETag
requirements:
  - https://example.org/touchstone/req/lws10-core/get-data-resource-content-range-etag
steps:
  - name: create a data resource from a body fixture
    request:
      method: POST
      target: "${test.container}"
      headers:
        Content-Type: text/plain
        Slug: note
      bodyRef: bodies/note.txt
    expect:
      status: 201
    bind:
      created: "header:Location"

  - name: read it back byte-exact with metadata
    request:
      method: GET
      target: "${created}"
    expect:
      status: 200
      headers:
        Content-Type: { contains: text/plain }
        ETag: { present: true }
      body:
        equalsRef: bodies/note.txt
