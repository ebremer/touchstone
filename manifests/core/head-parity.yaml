schemaVersion: 1
id: core/head-parity
title: HEAD returns the same headers as GET without a body
requirements:
  - https://example.org/touchstone/req/lws10-core/head-parity-with-get
steps:
  - name: create a data resource
    request:
      method: POST
      target: "${test.container}"
      headers:
        Content-Type: text/plain
      body: "head parity check"
    expect:
      status: 201
    bind:
      created: "header:Location"

  - name: HEAD carries GET's headers and no body
    request:
      method: HEAD
      target: "${created}"
    expect:
      status: 200
      headers:
        Content-Type: { contains: text/plain }
        ETag: { present: true }
      body:
        empty: true
