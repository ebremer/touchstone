schemaVersion: 1
id: auth-oidc/bad-signature-401
title: A token with an invalid signature is rejected with 401
requirements:
  - https://example.org/touchstone/req/lws10-core/authz-jwt-signature-jwks-rotation
  - https://example.org/touchstone/req/lws10-core/authz-invalid-token-401-error-param
capabilities: [authentication]
as: alice-bad-signature
steps:
  - name: a token signed by a foreign key is refused
    request:
      method: GET
      target: "${run.root}"
      headers:
        Accept: application/lws+json
    expect:
      status: 401
      headers:
        WWW-Authenticate: { contains: 'error="invalid_token"' }
