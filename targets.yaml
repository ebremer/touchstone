# Pre-registered SUT targets (DESIGN.md paragraph 7.1): Touchstone front ends accept
# only these ids, never raw URLs — this file is the SSRF/abuse boundary.
#
# Start the local reference server first:
#   mvn -pl harness-fixtures exec:java -Dexec.args=4711
targets:
  ref:
    baseUrl: http://localhost:4711/
    adapter: env
    capabilities: []
    properties: {}
  vulcan:
    baseUrl: https://vulcan.bmi.stonybrook.edu/alpha/
    adapter: env
    capabilities: []
    properties:
      # /alpha/ grants the public nothing, so the suite must act as a named agent (D-0028).
      # This covers provisioning (the run root) as well as every step declaring no `as`.
      defaultIdentity: touchstone
      # The credential is NEVER stored here — this file is checked in. Supply it in the
      # harness's environment as TOUCHSTONE_TOKEN_<IDENTITY>, uppercased: for the identity
      # above, TOUCHSTONE_TOKEN_TOUCHSTONE.
      #
      # For an LWS-OIDC target it must be an ID Token (not the access token) from the
      # OpenID Provider that the identity's WebID names in its controlled identifier
      # document, and its `sub` must be that WebID — that is the chain the resource server
      # dereferences to decide whether to trust the issuer. Which OP, which client and which
      # grant are deployment facts and belong in the operator's environment, not in a file
      # that ships with the harness.
      #
      # ID Tokens are typically short-lived (5 minutes on a stock Keycloak) while a core run
      # takes ~60s, so one token covers a run; mint a fresh one per session. See D-0030.
