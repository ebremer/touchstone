# Pre-registered SUT targets (DESIGN.md paragraph 7.1): Touchstone front ends accept
# only these ids, never raw URLs — this file is the SSRF/abuse boundary.
#
# Start the local reference server first:
#   mvn -pl harness-fixtures exec:java -Dexec.args=4711
targets:
  ref:
    baseUrl: http://localhost:4711/
    adapter: env
    capabilities: []
    properties: {}
  vulcan:
    baseUrl: https://vulcan.bmi.stonybrook.edu/alpha/
    adapter: env
    capabilities: []
    properties:
      # /alpha/ grants the public nothing, so the suite must act as a named agent (D-0028).
      # This covers provisioning (the run root) as well as every step declaring no `as`.
      defaultIdentity: touchstone
      # The credential is NEVER stored here — this file is checked in and is the SSRF/abuse
      # boundary. Supply it in the MCP server's environment as TOUCHSTONE_TOKEN_TOUCHSTONE:
      # the ID Token (not the access token) from
      #   POST https://ebremer.com/auth/realms/Halcyon/protocol/openid-connect/token
      #        grant_type=password  client_id=lws-app  scope=openid
      # whose `sub` is the WebID https://ebremer.com/id/touchstone. That WebID's controlled
      # identifier document names the same realm as its lws:OpenIdProvider, which is what
      # Halcyon's LwsOidcVerifier dereferences to decide whether to trust the issuer.
      #
      # The token lives 5 minutes (Keycloak default) and a core run takes ~60s, so one
      # token covers a run; mint a fresh one per session. See D-0030.
