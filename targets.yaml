# Pre-registered SUT targets (DESIGN.md paragraph 7.1): Touchstone front ends accept
# only these ids, never raw URLs — this file is the SSRF/abuse boundary.
#
# What a target may declare is in definitions/EXECUTION.md section 5: capabilities
# (Authentication, HarnessIssuedTokens, ReachableFixtures, SamlTrust) and properties such as
# webid.<name>, fixtures.baseUrl, timeout and parallelism. Credentials never go in this file.
#
# Start the local reference server first:
#   mvn -pl harness-fixtures exec:java -Dexec.args=4711
# For the secured reference deployment, SecuredRefScenarioMain writes its own registry.
targets:
  ref:
    baseUrl: http://localhost:4711/
    adapter: env
    capabilities: []
    properties: {}
  vulcan:
    baseUrl: https://vulcan.bmi.stonybrook.edu/alpha/
    adapter: env
    # /alpha/ grants the public nothing, so every request that is not deliberately anonymous
    # acts as alice, provisioning included. Declare Authentication once a token for a second
    # agent, bob, is available too; until then the tests that need both are inapplicable.
    capabilities: []
    properties: {}
    # alice's credential is NEVER stored here: this file is checked in. Supply it in the
    # harness's environment as TOUCHSTONE_TOKEN_ALICE (bob's as TOUCHSTONE_TOKEN_BOB).
    #
    # For an LWS-OIDC target it must be an ID Token (not the access token) from the OpenID
    # Provider that the identity's WebID names in its controlled identifier document, and its
    # `sub` must be that WebID: that is the chain the resource server dereferences to decide
    # whether to trust the issuer. Which OP, which client and which grant are deployment facts
    # and belong in the operator's environment, not in a file that ships with the harness.
    #
    # ID Tokens are typically short-lived (5 minutes on a stock Keycloak), and a run of every
    # definition takes seconds, so one token covers a run; mint a fresh one per session. See
    # D-0030.
