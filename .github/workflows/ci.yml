name: CI

on:
  push:
    # The default branch is master, not main. Naming the wrong one meant no push to the
    # default branch ever ran CI, and only pull requests did — so the Phase 0 acceptance
    # criterion ("green CI on main", D-0007) was never actually being met (D-0044).
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: CLI smoke test (touchstone --version)
        run: java -jar harness-cli/target/touchstone.jar --version
