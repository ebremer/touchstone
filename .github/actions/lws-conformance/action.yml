name: LWS Conformance (Touchstone)
description: >-
  Run the Touchstone conformance harness against a running LWS server and publish an
  EARL + HTML + JUnit report. Add this to any server-implementation repo to get a
  conformance report on every push.
author: Erich Bremer

inputs:
  target-url:
    description: Base URL of the running LWS server to test (the system under test).
    required: true
  module:
    description: Test module to run (core, auth-oidc, ...).
    required: false
    default: core
  fail-on-nonconformance:
    description: Fail the job when the run is non-conformant (any failure or error).
    required: false
    default: "true"
  report-path:
    description: Directory (relative to the workspace) to write reports into.
    required: false
    default: touchstone-reports

outputs:
  report-dir:
    description: Directory containing run.json, earl.ttl, junit.xml, and report.html.
    value: ${{ steps.run.outputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Build the Touchstone image
      shell: bash
      # github.action_path is .../.github/actions/lws-conformance; the repo root is three up.
      run: docker build -t touchstone-harness:local "${{ github.action_path }}/../../.."

    - name: Register the target (id only — never a URL to the tools; DESIGN.md 7.1)
      shell: bash
      # Inputs reach the shell through env, never through ${{ }} interpolation into the script.
      # targets.yaml IS the SSRF/abuse boundary (DESIGN.md 7.1), and interpolating a caller-supplied
      # string into the heredoc that writes it means a newline in target-url can append further
      # target entries or shell. Quoting the heredoc delimiter stops the shell expanding the value,
      # and the URL is validated before it is written.
      env:
        TARGET_URL: ${{ inputs.target-url }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        case "$TARGET_URL" in
          http://*|https://*) ;;
          *) echo "target-url must be an absolute http(s) URL: $TARGET_URL" >&2; exit 2 ;;
        esac
        if printf '%s' "$TARGET_URL" | grep -q '[[:space:]"]'; then
          echo "target-url must not contain whitespace or quotes" >&2
          exit 2
        fi
        mkdir -p "$GITHUB_WORKSPACE/$REPORT_PATH"
        {
          printf 'targets:\n  sut:\n    baseUrl: "%s"\n    adapter: env\n' "$TARGET_URL"
        } > "$GITHUB_WORKSPACE/$REPORT_PATH/targets.yaml"

    - name: Run conformance
      id: run
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
        MODULE: ${{ inputs.module }}
        FAIL_ON_NONCONFORMANCE: ${{ inputs.fail-on-nonconformance }}
      run: |
        set +e
        # The image runs as a non-root user; run it as the invoking one so reports written into
        # the bind-mounted workspace are owned by whoever the runner is, not by a uid baked in.
        docker run --rm --network host --user "$(id -u):$(id -g)" \
          -v "$GITHUB_WORKSPACE/$REPORT_PATH:/work" \
          touchstone-harness:local \
          run --target sut --module "$MODULE" \
              --targets /work/targets.yaml --report-dir /work/runs \
              --catalog catalog --manifests manifests
        code=$?
        echo "report-dir=$REPORT_PATH/runs" >> "$GITHUB_OUTPUT"
        # The CLI distinguishes the two ways a run can end badly: 1 is a non-conformant server,
        # 2 is a misconfigured harness — an unknown target, a missing registry, a manifest naming
        # a requirement the catalog lacks. Collapsing them told a server implementer their server
        # had failed when the workflow was wrong, so 2 always fails the job and says so.
        if [ "$code" -ge 2 ]; then
          echo "::error::Touchstone could not run (exit $code): the harness is misconfigured," \
               "not the server non-conformant. See the log above."
          exit "$code"
        fi
        if [ "$FAIL_ON_NONCONFORMANCE" = "true" ]; then
          exit $code
        fi
        exit 0

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: touchstone-conformance-report
        path: ${{ inputs.report-path }}/runs
